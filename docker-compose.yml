# Local dependencies for development: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qowl
      POSTGRES_PASSWORD: qowl_dev_password
      POSTGRES_DB: qowl_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
volumes:
  pgdata:
