name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: qowl, POSTGRES_PASSWORD: qowl_dev_password, POSTGRES_DB: qowl_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qowl" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://qowl:qowl_dev_password@localhost:5432/qowl_test
      DATABASE_URL: postgresql://qowl:qowl_dev_password@localhost:5432/qowl_test
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
      CRON_SECRET: ci-cron-secret-0123456789
      PAYMENT_PROVIDER: mock
      MOCK_PAYMENT_SECRET: ci-mock
      SHIPPING_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-results, path: test-results }
